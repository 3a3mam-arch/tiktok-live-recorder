name: TikTok Auto Recorder 24/7
on:
  schedule:
    - cron: '*/5 * * * *' # يعمل تلقائياً كل 5 دقائق
  workflow_dispatch: # للتشغيل اليدوي والتجربة

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Clone Original Repository
        run: |
          # جلب كافة ملفات الأداة الأصلية للتأكد من وجود main.py و requirements
          git clone https://github.com temp_repo
          cp -r temp_repo/* .
          rm -rf temp_repo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Run Recorder & Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py -mode automatic -ffmpeg
          
          for f in *.mp4; do
            [ -e "$f" ] || continue
            curl -F video="@$f" https://telegram.org
          done
