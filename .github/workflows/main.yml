name: TikTok Auto Recorder 24/7
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yt-dlp requests

      - name: Run Recorder Script Directly
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c '
          import os, sys, time, subprocess, requests

          # قراءة الحسابات من الملف
          if not os.path.exists("users.txt"):
              print("Error: users.txt not found!")
              sys.exit(1)
              
          with open("users.txt", "r") as f:
              users = [line.strip() for line in f if line.strip()]

          tg_token = os.environ.get("TG_TOKEN")
          tg_id = os.environ.get("TG_ID")

          for user in users:
              print(f"Checking user: {user}")
              # استخدام yt-dlp للتحقق من البث المباشر وتسجيله فوراً إن وجد
              url = f"https://tiktok.com@{user}/live"
              out_file = f"{user}_{int(time.time())}.mp4"
              
              print(f"Checking live status for {user}...")
              res = subprocess.run(["yt-dlp", "--check-live-status", url], capture_output=True, text=True)
              
              if "is online" in res.stdout or res.returncode == 0:
                  print(f"User {user} is LIVE! Starting download...")
                  # بدء التسجيل وحفظ الملف
                  subprocess.run(["yt-dlp", "-o", out_file, url])
                  
                  # إرسال الفيديو إلى تليجرام بعد انتهاء البث
                  if os.path.exists(out_file) and os.path.getsize(out_file) > 0:
                      print(f"Sending {out_file} to Telegram...")
                      with open(out_file, "rb") as video:
                          requests.post(f"https://telegram.org{tg_token}/sendVideo", data={"chat_id": tg_id}, files={"video": video})
              else:
                  print(f"User {user} is offline.")
          '
