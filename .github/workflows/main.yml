name: TikTok Auto Recorder 24/7
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yt-dlp requests

      - name: Run Recorder Script Directly
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          python -c '
          import os, sys, time, subprocess, requests

          workspace = os.environ.get("WORKSPACE_PATH")
          users_file = os.path.join(workspace, "users.txt")

          if not os.path.exists(users_file):
              print(f"Error: users.txt not found!")
              sys.exit(1)
              
          with open(users_file, "r") as f:
              users = [line.strip() for line in f if line.strip()]

          tg_token = os.environ.get("TG_TOKEN")
          tg_id = os.environ.get("TG_ID")

          for user in users:
              print(f"Checking user: {user}")
              # تصحيح الرابط بإضافة المائلة المفقودة بشكل صريح
              url = "https://tiktok.com@" + str(user) + "/live"
              out_file = f"{user}_{int(time.time())}.mp4"
              
              print(f"Attempting direct download for {user} in case they are LIVE...")
              res = subprocess.run(["yt-dlp", "--match-filter", "is_live", "-o", out_file, url])
              
              if os.path.exists(out_file) and os.path.getsize(out_file) > 100000:
                  print(f"Success! Sending recorded live for {user} to Telegram...")
                  with open(out_file, "rb") as video:
                      requests.post(f"https://telegram.org{tg_token}/sendVideo", data={"chat_id": tg_id}, files={"video": video})
                  os.remove(out_file)
              else:
                  print(f"User {user} appears to be offline or stream ended.")
                  if os.path.exists(out_file):
                      os.remove(out_file)
          '
